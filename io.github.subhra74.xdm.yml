app-id: io.github.subhra74.xdm
runtime: org.freedesktop.Platform
runtime-version: '23.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.dotnet8
command: xdm-app
finish-args:
  - --share=network
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --filesystem=host
  - --talk-name=org.kde.StatusNotifierWatcher
build-options:
  append-path: /usr/lib/sdk/dotnet8/bin
  append-ld-library-path: /usr/lib/sdk/dotnet8/lib
  env:
    DOTNET_ROOT: /usr/lib/sdk/dotnet8
modules:
  - name: xdm
    buildsystem: simple
    build-commands:
      - dotnet publish app/XDM/XDM.Gtk.UI/XDM.Gtk.UI.csproj -c Release -r linux-x64 --self-contained true -p:PublishSingleFile=true -o /app/bin/xdm-app-dir
      - ln -s /app/bin/xdm-app-dir/xdm-app /app/bin/xdm-app
    sources:
      - type: dir
        path: .
