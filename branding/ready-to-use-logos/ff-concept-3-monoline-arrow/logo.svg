  <!-- Minimalist Geometric Dual FF Media Download Chevron -->
  <g transform="translate(0, 0)">
    <!-- First 'F' (Fetch) - Solid Vibrant Orange -->
    <path d="M 150 120 L 320 120 L 320 170 L 210 170 L 210 220 L 290 220 L 290 270 L 210 270 L 210 330 L 150 330 Z" 
          fill="#f97316"/>

    <!-- Second 'F' (Flow) - Solid Cool Cyan / White Accent -->
