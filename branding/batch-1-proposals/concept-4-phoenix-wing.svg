<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- © Mayanktaker Computers & Web Development | https://mayanktaker.com -->
  <defs>
    <!-- Background Dark Squircle -->
    <linearGradient id="p4Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c2024"/>
      <stop offset="100%" stop-color="#0d0f12"/>
    </linearGradient>

    <!-- Primary Wing Flame -->
    <linearGradient id="p4WingOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="50%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>

    <!-- Wing Gold Blades -->
    <linearGradient id="p4WingGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="60%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <filter id="p4Glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#ea580c" flood-opacity="0.3"/>
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- App Icon Squircle Container -->
  <rect width="512" height="512" rx="120" fill="url(#p4Bg)" stroke="#2d333b" stroke-width="2"/>

  <!-- Phoenix Speed-Wing Chevron (No text) -->
  <g filter="url(#p4Glow)" transform="translate(0, 10)">
    <!-- Outer Wing Wingspan -->
    <polygon points="256,230 115,130 170,120 256,180 342,120 397,130" fill="url(#p4WingOrange)"/>
    
    <!-- Secondary Wing Layer -->
    <polygon points="256,280 135,175 190,165 256,220 322,165 377,175" fill="url(#p4WingGold)"/>

    <!-- Tertiary Lower Feathers -->
    <polygon points="256,330 160,225 210,215 256,260 302,215 352,225" fill="url(#p4WingOrange)"/>

    <!-- Piercing Downward Tail Arrow -->
    <polygon points="256,420 216,330 256,360 296,330" fill="url(#p4WingGold)"/>
    <polygon points="256,420 256,360 296,330" fill="#b45309" opacity="0.3"/>

    <!-- Central Crest Diamond -->
    <polygon points="256,150 236,190 256,180 276,190" fill="#ffffff"/>
  </g>
</svg>
