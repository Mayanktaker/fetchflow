<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- © Mayanktaker Computers & Web Development | https://mayanktaker.com -->
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e2430"/>
      <stop offset="100%" stop-color="#0f131a"/>
    </linearGradient>

    <!-- Orange Flow Gradient -->
    <linearGradient id="orangeStream" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="50%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>

    <!-- Tech Blue Flow Gradient -->
    <linearGradient id="blueStream" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>

    <!-- Arrow Head Gradient -->
    <linearGradient id="arrowGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff782e"/>
      <stop offset="50%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- App Icon Squircle Base -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad1)" stroke="#334155" stroke-width="2"/>

  <!-- Logo Mark Group -->
  <g filter="url(#softShadow)" transform="translate(0, 10)">
    <!-- Primary Orange Flow Ribbon (Left Segment) -->
    <path d="M 130 150 C 130 150 180 130 220 170 C 255 205 240 290 240 310 L 160 250 C 160 250 210 330 256 390 L 256 390 C 230 360 170 300 150 270 C 120 220 120 180 130 150 Z" 
          fill="url(#orangeStream)" />

    <!-- Primary Blue Flow Ribbon (Right Segment) -->
    <path d="M 382 150 C 382 150 332 130 292 170 C 257 205 272 290 272 310 L 352 250 C 352 250 302 330 256 390 L 256 390 C 282 360 342 300 362 270 C 392 220 392 180 382 150 Z" 
          fill="url(#blueStream)" />

    <!-- Central Fast Download Core Vector -->
    <path d="M 235 110 C 235 110 256 95 277 110 L 277 260 L 325 260 L 256 355 L 187 260 L 235 260 Z" 
          fill="#ffffff" opacity="0.95"/>
    
    <!-- Dynamic Confluence Accent Arrow -->
    <path d="M 210 290 L 256 350 L 302 290 L 330 310 L 256 410 L 182 310 Z" 
          fill="url(#orangeStream)"/>
  </g>
</svg>
