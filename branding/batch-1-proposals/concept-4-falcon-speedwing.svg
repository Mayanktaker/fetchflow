<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- © Mayanktaker Computers & Web Development | https://mayanktaker.com -->
  <defs>
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>

    <linearGradient id="wingPrimary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="50%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>

    <linearGradient id="wingGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="60%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <linearGradient id="wingSilver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>

    <filter id="falconShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#ea580c" flood-opacity="0.25"/>
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- App Icon Squircle Base -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad4)" stroke="#27272a" stroke-width="2"/>

  <!-- Aerodynamic Falcon Speed-Wing Chevron -->
  <g filter="url(#falconShadow)" transform="translate(0, 16)">
    <!-- Outer Upper Wing Spans -->
    <polygon points="256,230 110,140 180,120 256,190 332,120 402,140" 
             fill="url(#wingPrimary)"/>

    <!-- Mid Inner Aerodynamic Layer -->
    <polygon points="256,290 145,190 205,175 256,235 307,175 367,190" 
             fill="url(#wingGold)"/>

    <!-- Supersonic Speed Flanks -->
    <polygon points="175,250 256,330 256,360 150,275" fill="url(#wingSilver)"/>
    <polygon points="337,250 256,330 256,360 362,275" fill="url(#wingSilver)"/>

    <!-- Precision Downward Vector Diamond / Core Piercing Tip -->
    <polygon points="256,410 215,330 256,355 297,330" 
             fill="url(#wingPrimary)"/>
    
    <!-- Central Crest -->
    <polygon points="256,150 236,190 256,180 276,190" fill="#ffffff"/>
  </g>
</svg>
