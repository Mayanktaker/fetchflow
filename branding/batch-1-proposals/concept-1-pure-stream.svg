<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- © Mayanktaker Computers & Web Development | https://mayanktaker.com -->
  <defs>
    <!-- Background Dark Squircle -->
    <linearGradient id="p1Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e222b"/>
      <stop offset="100%" stop-color="#0f1117"/>
    </linearGradient>

    <!-- Left Stream (Orange) -->
    <linearGradient id="p1Orange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="50%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>

    <!-- Right Stream (Cyan/Azure) -->
    <linearGradient id="p1Cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <filter id="p1Shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- App Icon Squircle Container -->
  <rect width="512" height="512" rx="120" fill="url(#p1Bg)" stroke="#2d3340" stroke-width="2"/>

  <!-- Pure Icon Graphic (No text) -->
  <g filter="url(#p1Shadow)">
    <!-- Left Orange Convergent Stream -->
    <path d="M 175 130 C 175 130 220 140 220 230 C 220 290 190 310 190 310 L 256 385 L 256 260 C 256 200 215 130 175 130 Z" 
          fill="url(#p1Orange)"/>
    <path d="M 175 130 L 215 130 C 215 130 256 200 256 260 L 256 385 L 190 310 L 215 310 C 215 260 175 220 175 130 Z" 
          fill="url(#p1Orange)" opacity="0.9"/>
    <!-- Left Arrow Wing -->
    <polygon points="190,310 256,385 256,330 210,290" fill="#f97316"/>

    <!-- Right Cyan Interlocking Stream -->
    <path d="M 337 130 C 337 130 292 140 292 230 C 292 290 322 310 322 310 L 256 385 L 256 260 C 256 200 297 130 337 130 Z" 
          fill="url(#p1Cyan)"/>
    <polygon points="322,310 256,385 256,330 302,290" fill="#06b6d4"/>

    <!-- Central High-Velocity Ingestion Tip -->
    <polygon points="256,405 190,310 235,310 235,210 277,210 277,310 322,310" 
             fill="none" stroke="#ffffff" stroke-width="4" opacity="0.4"/>
    <polygon points="256,415 190,320 225,320 256,365 287,320 322,320" 
             fill="#ffffff" opacity="0.95"/>
  </g>
</svg>
