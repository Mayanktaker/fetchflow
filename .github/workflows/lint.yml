name: Lint Shell Scripts

on:
  push:
    branches: [ "master" ]
    paths:
      - 'scripts/**'
      - 'app/XDM/XDM.Linux.Installer/make-*'
      - 'build_all.sh'
      - 'build_rpm.sh'
      - 'xdm-updater.sh'
      - '.github/workflows/lint.yml'
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

jobs:
  shellcheck:
    name: ShellCheck installer & packaging scripts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install ShellCheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck

      - name: Lint shell scripts
        # The target list lives in scripts/lint-shell.sh so a local run and this gate
        # cannot drift apart; add new scripts there, not here.
        run: bash scripts/lint-shell.sh
