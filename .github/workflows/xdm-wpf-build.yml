name: Windows Desktop CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    name: Build & Package Windows Desktop
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Read package version
        id: ver
        shell: pwsh
        run: |
          # Single source of truth: app/XDM/XDM.Linux.Installer/version.env
          $line = Get-Content app/XDM/XDM.Linux.Installer/version.env | Where-Object { $_ -match '^VERSION=' } | Select-Object -First 1
          $version = $line -replace '^VERSION=', ''
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Version: $version"

      - name: Publish WPF Application
        run: dotnet publish -c Release -f net4.7.2 app/XDM/XDM.Wpf.UI/XDM.Wpf.UI.csproj -o build_output/xdm-win-x64

      - name: Build WinForms Integration UI (into publish tree)
        run: dotnet publish -c Release -f net4.7.2 app/XDM/XDM.WinForms.IntegrationUI/XDM.WinForms.IntegrationUI.csproj -o build_output/xdm-win-x64

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Compile installer
        shell: pwsh
        run: |
          # Drives fetchflow-setup.iss defines; versioned output lands in fetchflow-release/
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = "$env:ProgramFiles\Inno Setup 6\ISCC.exe" }
          $ver = "${{ steps.ver.outputs.version }}"
          Set-Location app/XDM/XDM.Win.Installer
          & $iscc "/DAppVersion=$ver" "/DOutputBaseName=fetchflow-windows-x64-$ver-setup" fetchflow-setup.iss

      - name: Create portable ZIP
        shell: pwsh
        run: |
          $ver = "${{ steps.ver.outputs.version }}"
          New-Item -ItemType Directory -Force -Path fetchflow-release | Out-Null
          Compress-Archive -Path build_output/xdm-win-x64/* -DestinationPath "fetchflow-release/fetchflow-windows-x64-portable-$ver.zip" -Force

      - name: Generate SHA256 checksums
        shell: pwsh
        run: |
          # Windows-side checksum manifest (kept separate from Linux SHA256SUMS.txt)
          $ver = "${{ steps.ver.outputs.version }}"
          $lines = @()
          Get-ChildItem fetchflow-release -Filter "fetchflow-windows-*" | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            $lines += "$hash  $($_.Name)"
          }
          $lines | Set-Content -Encoding ascii "fetchflow-release/SHA256SUMS-windows-$ver.txt"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fetchflow-windows-${{ steps.ver.outputs.version }}
          path: |
            fetchflow-release/fetchflow-windows-*
            fetchflow-release/SHA256SUMS-windows-*.txt
          if-no-files-found: error
