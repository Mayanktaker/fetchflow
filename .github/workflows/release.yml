name: Release FetchFlow

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    name: Build & Package Linux Artifacts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK 8.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install packaging tools and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm dpkg-dev zip tar libgtk-3-0 xvfb

      - name: Run automated test suite
        run: |
          xvfb-run bash scripts/run-gtk-smoke.sh --no-xvfb -- dotnet test app/XDM/XDM.Tests/XDM.Tests.csproj -c Release

      - name: Build and package Linux release artifacts
        env:
          MOZ_API_KEY: ${{ secrets.MOZ_API_KEY }}
          MOZ_API_SECRET: ${{ secrets.MOZ_API_SECRET }}
        run: |
          # Read version from installer environment
          source app/XDM/XDM.Linux.Installer/version.env
          OUT_DIR="$(pwd)/fetchflow-release"
          mkdir -p "$OUT_DIR" build_output/xdm-app

          echo "=== 1. Packaging Browser Extensions ==="
          cd app/XDM/chrome-extension
          zip -r "$OUT_DIR/fetchflow-chrome-extension-${VERSION}.zip" . -x ".*"
          cd ../../..

          cd app/XDM/firefox-amo
          if [ -n "$MOZ_API_KEY" ] && [ -n "$MOZ_API_SECRET" ]; then
            npx -y web-ext sign --api-key="$MOZ_API_KEY" --api-secret="$MOZ_API_SECRET" --channel=unlisted --artifacts-dir=web-ext-artifacts
            cp web-ext-artifacts/*.xpi "$OUT_DIR/fetchflow-firefox-extension-${VERSION}.xpi"
          else
            zip -r "$OUT_DIR/fetchflow-firefox-extension-${VERSION}.xpi" . -x ".*"
          fi
          cd ../../..

          echo "=== 2. Publishing FetchFlow Linux Application ==="
          dotnet publish app/XDM/XDM.Gtk.UI/XDM.Gtk.UI.csproj -c Release -r linux-x64 \
            --self-contained true -p:PublishSingleFile=true -o build_output/xdm-app

          cp -r app/XDM/chrome-extension build_output/xdm-app/
          cp -r app/XDM/firefox-amo build_output/xdm-app/firefox-extension
          cp -r app/XDM/XDM.Gtk.UI/svg-icons build_output/xdm-app/
          cp -r app/XDM/XDM.Gtk.UI/glade build_output/xdm-app/
          cp -r app/XDM/XDM.Gtk.UI/theme build_output/xdm-app/
          cp -r app/XDM/XDM.Gtk.UI/images build_output/xdm-app/
          cp -r app/XDM/Lang build_output/xdm-app/
          cp app/XDM/fetchflow-logo.svg build_output/xdm-app/ 2>/dev/null || :
          cp app/XDM/XDM.Gtk.UI/fetchflow-logo-512.png build_output/xdm-app/ 2>/dev/null || :
          cp app/XDM/XDM.Gtk.UI/fetchflow-logo.png build_output/xdm-app/ 2>/dev/null || :

          echo "=== 3. Packaging Portable Tarball ==="
          cd build_output/xdm-app
          tar -czvf "$OUT_DIR/fetchflow-linux-x64-${VERSION}.tar.gz" *
          cd ../..

          echo "=== 4. Building Linux Packages (RPM & DEB) ==="
          cd app/XDM/XDM.Linux.Installer
          rm -rf rpmbuild fetchflow-${VERSION}.tar.gz fetchflow-${VERSION}
          mkdir -p binary-source
          rm -rf binary-source/*
          cp -r ../../../build_output/xdm-app/* binary-source/

          bash make-rpm-pkg
          bash make-deb-pkg

          cp rpmbuild/RPMS/x86_64/*.rpm "$OUT_DIR/" 2>/dev/null || :
          cp *.deb "$OUT_DIR/" 2>/dev/null || :
          cd ../../..

          echo "=== Linux Artifacts summary ==="
          ls -lh "$OUT_DIR"

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: |
            fetchflow-release/*.tar.gz
            fetchflow-release/*.rpm
            fetchflow-release/*.deb
            fetchflow-release/*.zip
            fetchflow-release/*.xpi

  build-windows:
    name: Build & Package Windows Artifacts
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK 8.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Resolve Version from Environment
        shell: pwsh
        run: |
          $verLine = Get-Content app/XDM/XDM.Linux.Installer/version.env | Where-Object { $_ -match '^VERSION=(.+)$' }
          $version = if ($verLine) { $Matches[1].Trim() } else { "9.1.10" }
          Write-Host "Resolved Version: $version"
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build Windows Executables
        shell: pwsh
        run: |
          $winDir = "build_output\xdm-win-x64"
          $outDir = "fetchflow-release"
          New-Item -ItemType Directory -Force -Path $winDir, $outDir

          # Compile WPF main UI and WinForms integration guide in Release mode
          dotnet build -c Release -f net4.7.2 app/XDM/XDM.Wpf.UI/XDM.Wpf.UI.csproj -o $winDir
          dotnet build -c Release -f net4.7.2 app/XDM/XDM.WinForms.IntegrationUI/XDM.WinForms.IntegrationUI.csproj -o $winDir

          # Copy browser extensions and brand assets
          Copy-Item -Recurse -Force "app\XDM\chrome-extension" "$winDir\chrome-extension"
          Copy-Item -Recurse -Force "app\XDM\firefox-amo" "$winDir\firefox-extension"
          Copy-Item -Force "app\XDM\fetchflow-logo.ico" "$winDir\xdm-logo.ico"
          Copy-Item -Force "app\XDM\fetchflow-logo.svg" "$winDir\fetchflow-logo.svg"
          Copy-Item -Force "app\XDM\fetchflow-logo-512.png" "$winDir\fetchflow-logo-512.png"

          # Package Portable Windows ZIP
          Compress-Archive -Path "$winDir\*" -DestinationPath "$outDir\fetchflow-windows-x64-$env:VERSION.zip" -Force
          Write-Host "Generated Portable ZIP: $outDir\fetchflow-windows-x64-$env:VERSION.zip"

      - name: Build Inno Setup Installer
        shell: pwsh
        run: |
          # Install Inno Setup compiler
          choco install innosetup --no-progress
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            $iscc = (Get-Command iscc.exe -ErrorAction SilentlyContinue).Source
          }
          Write-Host "Using Inno Setup compiler at: $iscc"

          # Compile standalone Windows installer .exe
          & $iscc "/DAppVersion=$env:VERSION" "/DSourceDir=..\..\..\build_output\xdm-win-x64" "/DOutputDir=..\..\..\fetchflow-release" app\XDM\XDM.Win.Installer\fetchflow-setup.iss
          Write-Host "Generated Windows Setup Installer: fetchflow-release\fetchflow-windows-x64-setup.exe"

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: |
            fetchflow-release/fetchflow-windows-x64-*.zip
            fetchflow-release/fetchflow-windows-x64-setup.exe

  publish-release:
    name: Publish Release & Checksums
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-artifacts
          path: fetchflow-release

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-artifacts
          path: fetchflow-release

      - name: Generate Unified SHA256 Checksums
        run: |
          cd fetchflow-release
          rm -f SHA256SUMS.txt
          sha256sum * > SHA256SUMS.txt
          echo "=== Complete Release Artifacts ==="
          ls -lh
          echo "=== SHA256SUMS.txt ==="
          cat SHA256SUMS.txt

      - name: Upload Complete Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fetchflow-complete-release
          path: fetchflow-release/*

      - name: Create GitHub Release and Upload Assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: fetchflow-release/*
          generate_release_notes: true
