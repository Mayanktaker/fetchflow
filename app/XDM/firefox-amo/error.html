<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <script src="error.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="page">
    <div class="page-card">
        <header class="popup-header" style="margin: -24px -24px 16px -24px; border-radius: 10px 10px 0 0;">
            <span class="brand-mark" aria-hidden="true"></span>
            <span class="popup-title">FetchFlow</span>
        </header>
        <div class="error-msg">
            <p>Unable to connect with FetchFlow, please make sure FetchFlow is running</p>
        </div>
        <div class="btn-row">
            <button class="btn btn-primary" id="OpenLink">Launch FetchFlow</button>
        </div>
    </div>
</body>
</html>
