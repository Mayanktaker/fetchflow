<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>FetchFlow - Large Blob Download</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; padding: 20px; background: #1a1a2e; color: #e0e0e0; }
        .container { max-width: 400px; margin: 0 auto; }
        h2 { color: #ff6b35; margin: 0 0 12px; font-size: 16px; }
        .info { font-size: 13px; color: #aaa; margin-bottom: 16px; line-height: 1.5; }
        .size { color: #ff6b35; font-weight: bold; }
        .btn-row { display: flex; gap: 10px; }
        button { flex: 1; padding: 8px 16px; border: none; border-radius: 4px; cursor: pointer; font-size: 13px; font-weight: 600; }
        .btn-ok { background: #ff6b35; color: #fff; }
        .btn-ok:hover { background: #e55a2b; }
        .btn-cancel { background: #333; color: #ccc; }
        .btn-cancel:hover { background: #444; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Large Blob Download</h2>
        <p class="info">This file (<span class="size" id="size"></span>) exceeds the configured blob size limit. Transfer it to FetchFlow anyway?</p>
        <div class="btn-row">
            <button class="btn-ok" id="btn-ok">Download with FetchFlow</button>
            <button class="btn-cancel" id="btn-cancel">Cancel</button>
        </div>
    </div>
    <script src="confirm.js"></script>
</body>
</html>
