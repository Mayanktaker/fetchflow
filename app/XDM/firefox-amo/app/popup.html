<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FetchFlow</title>
  <link rel="stylesheet" href="styles.css">
  <script src="popup.js"></script>
</head>
<body class="popup">
  <header class="popup-header">
    <div class="header-brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <div class="brand-info">
        <span class="popup-title">FetchFlow</span>
        <span class="popup-subtitle">Download Accelerator</span>
      </div>
    </div>
    <div class="header-status">
      <span class="status-pill" id="statusPill" title="Connected to FetchFlow Core">
        <span class="status-dot"></span>
        <span class="status-text">Active</span>
      </span>
    </div>
  </header>

  <main id="content" class="popup-body">
    <div id="mediaContainer" class="media-container">
      <div class="search-wrap">
        <svg class="search-icon" viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input type="text" id="searchInput" class="search-input" placeholder="Search by name or format..." autocomplete="off">
        <button id="clearSearch" class="search-clear-btn" style="display: none;" aria-label="Clear search">✕</button>
      </div>
      <div id="list" class="media-list"></div>
      <div class="toolbar-row">
        <button id="format" class="btn btn-secondary">
          <svg class="btn-icon" viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h7"/></svg>
          More Formats
        </button>
        <button id="clear" class="btn btn-ghost btn-danger-text">
          <svg class="btn-icon" viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18m-2 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
          Clear
        </button>
      </div>
    </div>

    <div id="emptyState" class="empty-state">
      <div class="empty-icon-wrap">
        <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.6">
          <polygon points="6 3 20 12 6 21 6 3"></polygon>
        </svg>
      </div>
      <div class="empty-title">No Media Detected</div>
      <div class="empty-desc">Play a video or audio stream in any browser tab to capture downloadable links.</div>
    </div>
  </main>

  <footer class="popup-footer">
    <label class="toggle-control" for="chk">
      <div class="toggle-label-wrap">
        <span class="toggle-title">Browser Monitoring</span>
        <span class="toggle-desc">Auto-capture video & file downloads</span>
      </div>
      <div class="toggle-switch">
        <input type="checkbox" id="chk">
        <span class="toggle-slider"></span>
      </div>
    </label>
  </footer>

  <div id="copyToast" class="toast-feedback" style="display: none;">Link copied to clipboard!</div>
</body>
</html>
