<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FetchFlow</title>
  <link rel="stylesheet" href="styles.css">
  <script src="popup.js"></script>
</head>
<body class="popup">
  <header class="popup-header">
    <div class="header-brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <div class="brand-info">
        <span class="popup-title">FetchFlow</span>
        <span class="popup-subtitle">Download Accelerator</span>
      </div>
    </div>
    <div class="header-actions">
      <button id="soundToggle" class="sound-toggle-btn" title="Toggle audio notification chime" aria-label="Toggle sound chime">
        <svg id="soundIconOn" viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2">
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
          <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
        </svg>
        <svg id="soundIconOff" viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" style="display: none;">
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
          <line x1="23" y1="9" x2="17" y2="15"></line>
          <line x1="17" y1="9" x2="23" y2="15"></line>
        </svg>
      </button>
      <span class="status-pill" id="statusPill" title="Connected to FetchFlow Core">
        <span class="status-dot"></span>
        <span class="status-text">Active</span>
      </span>
    </div>
  </header>

  <main id="content" class="popup-body">
    <div id="mediaContainer" class="media-container">
      <div class="scope-tabs-bar" role="tablist" aria-label="Media scope filter">
        <button id="scopeCurrentTab" class="scope-tab-btn active" role="tab" aria-selected="true" title="Show media from active tab only">
          <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/></svg>
          <span>This Tab</span>
          <span id="scopeCurrentCount" class="scope-count-badge">0</span>
        </button>
        <button id="scopeAllTabs" class="scope-tab-btn" role="tab" aria-selected="false" title="Show media across all open tabs">
          <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="7" width="16" height="14" rx="2"/><path d="M6 3h14a2 2 0 0 1 2 2v12"/></svg>
          <span>All Tabs</span>
          <span id="scopeAllCount" class="scope-count-badge">0</span>
        </button>
      </div>
      <div class="search-wrap">
        <svg class="search-icon" viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input type="text" id="searchInput" class="search-input" placeholder="Search by name or format..." autocomplete="off">
        <button id="clearSearch" class="search-clear-btn" style="display: none;" aria-label="Clear search">✕</button>
        <button id="refreshTabsBtn" class="search-refresh-btn" title="Refresh active tab & media streams" aria-label="Refresh">
          <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M23 4v6h-6M1 20v-6h6"/>
            <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
          </svg>
        </button>
      </div>
      <div id="emptyTabNotice" class="empty-tab-notice" style="display: none;">
        <span>No media on this tab.</span>
        <button id="switchToAllTabsBtn" class="btn-switch-tab">View All Tabs (<span id="emptyTabOtherCount">0</span>)</button>
      </div>
      <div id="list" class="media-list"></div>
      <div class="toolbar-row">
        <button id="downloadAll" class="btn btn-primary" title="Download all displayed streams">
          <svg class="btn-icon" viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.2">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/>
          </svg>
          Download All
        </button>
        <button id="format" class="btn btn-secondary">
          <svg class="btn-icon" viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h7"/></svg>
          Formats
        </button>
        <button id="clear" class="btn btn-ghost btn-danger-text">
          <svg class="btn-icon" viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18m-2 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
          Clear
        </button>
      </div>
    </div>

    <div id="emptyState" class="empty-state">
      <div class="empty-icon-wrap">
        <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.6">
          <polygon points="6 3 20 12 6 21 6 3"></polygon>
        </svg>
      </div>
      <div class="empty-title">No Media Detected</div>
      <div class="empty-desc">Play a video or audio stream in any browser tab to capture downloadable links.</div>
    </div>
  </main>

  <footer class="popup-footer">
    <div class="footer-health-row">
      <div class="health-pill" id="healthPill" title="Connection to FetchFlow Core">
        <span class="health-dot" id="healthDot"></span>
        <span class="health-text" id="healthText">WS · measuring...</span>
      </div>
      <button class="health-pill capture-test-btn" id="captureTestBtn"
        title="Run a real browser download to verify FetchFlow captures it end-to-end">
        <svg viewBox="0 0 24 24" width="11" height="11" fill="none" stroke="currentColor" stroke-width="2.2">
          <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
          <polyline points="22 4 12 14.01 9 11.01"></polyline>
        </svg>
        Test Capture
      </button>
    </div>
    <label class="toggle-control" for="chk">
      <div class="toggle-label-wrap">
        <span class="toggle-title">Browser Monitoring</span>
        <span class="toggle-desc">Auto-capture video & file downloads</span>
      </div>
      <div class="toggle-switch">
        <input type="checkbox" id="chk">
        <span class="toggle-slider"></span>
      </div>
    </label>
  </footer>

  <div id="copyToast" class="toast-feedback" style="display: none;">Link copied to clipboard!</div>
</body>
</html>
