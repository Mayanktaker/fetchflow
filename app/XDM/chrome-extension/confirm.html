<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>FetchFlow - Large Blob Download</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="page">
    <div class="page-card">
        <h2 class="card-title">Large Blob Download</h2>
        <p class="info">This file (<span class="size" id="size"></span>) exceeds the configured blob size limit. Transfer it to FetchFlow anyway?</p>
        <div class="btn-row">
            <button class="btn btn-primary" id="btn-ok">Download with FetchFlow</button>
            <button class="btn btn-flat" id="btn-cancel">Cancel</button>
        </div>
    </div>
    <script src="confirm.js"></script>
</body>
</html>
