<svg xmlns="http://www.w3.org/2000/svg" viewBox="90 80 330 360" width="512" height="512">
  <defs>
    <linearGradient id="ffCyanBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="50%" stop-color="#00b0ff"/>
      <stop offset="100%" stop-color="#3584e4"/>
    </linearGradient>
    <linearGradient id="ffAmberOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="40%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <filter id="ffGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <g filter="url(#ffGlow)">
    <!-- Upper Stream / F top arch (Cyan to Blue) -->
    <path d="M 175 270 C 180 180, 220 105, 330 105 C 380 105, 405 130, 395 160 C 375 185, 310 180, 275 190 C 235 200, 215 230, 205 270 Z" fill="url(#ffCyanBlue)"/>
    <path d="M 330 105 C 375 105, 395 130, 390 155 C 370 175, 330 175, 290 180 C 325 150, 355 135, 330 105 Z" fill="#70e2ff" opacity="0.8"/>

    <!-- Middle Stream / F Crossbar & Downward Flow (Amber to Orange) -->
    <path d="M 195 240 C 240 240, 290 235, 335 240 C 350 245, 355 260, 340 275 C 300 290, 230 295, 185 320 L 160 360 L 205 240 Z" fill="url(#ffAmberOrange)"/>

    <!-- Dynamic Downward Acceleration Arrow -->
    <path d="M 155 330 L 225 330 L 175 425 L 125 330 Z" fill="url(#ffAmberOrange)"/>
    <path d="M 175 425 L 225 330 L 185 330 Z" fill="#ea580c"/>
    <path d="M 175 425 L 125 330 L 165 330 Z" fill="#fb923c"/>
  </g>
</svg>
